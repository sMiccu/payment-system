version: '3'
services:

  db:
    container_name: payment-system-db
    image: postgres:16
    volumes:
      - db-store:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: payment_system_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: 'Asia/Tokyo'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 15s
      retries: 5

  django:
    container_name: payment-system-django
    build: .
    command: tail -f /dev/null
    volumes:
      - .:/payment-system
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    tty: true
    stdin_open: true

volumes:
  db-store:
