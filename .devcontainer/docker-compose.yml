services:
  # Pythonバックエンドサービス
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/backend/Dockerfile
    volumes:
      # ホストのルートフォルダをコンテナの/workspacesにマウント（devcontainer.jsonと統一）
      - ..:/workspaces/payment_system:cached
    ports:
      - "8000:8000" # Djangoを実行する場合
    # environment:
    #   - DATABASE_URL=mysql+pymysql://user:password@db:3306/devdb
    # dbサービスが起動してからbackendを起動
    # TODO
    depends_on:
      db:
        condition: service_healthy
    # 依存インストール後にDjango起動（必要ならdebugpyへ置換可）
    command: bash -lc "pip install -r payment_system/requirements.txt && cd payment_system && python manage.py runserver 0.0.0.0:8000"
    tty: true
    stdin_open: true

  # Next.jsフロントエンドサービス
  frontend:
    build:
      context: ..
      dockerfile: .devcontainer/frontend/Dockerfile
    volumes:
      - ..:/workspaces/payment_system:cached
    ports:
      - "3001:3000"
    # Node inspector を9229で待ち受け（VS Codeからアタッチ）
    command: sh -lc "cd frontend/webapp && npm ci && node --inspect=0.0.0.0:9229 ./node_modules/.bin/next dev --hostname 0.0.0.0 -p 3000"

  # MySQLデータベースサービス
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment_system_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      TZ: 'Asia/Tokyo'
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
    volumes:
      # 名前付きボリュームでデータを永続化
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: mysqladmin ping
      interval: 15s
      retries: 5

# データ永続化のための名前付きボリューム
volumes:
  mysql-data: