services:
  # Pythonバックエンドサービス
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/backend/Dockerfile
    volumes:
      # ホストのルートフォルダをコンテナの/workspacesにマウント（devcontainer.jsonと統一）
      - ..:/workspaces/payment_system:cached
    ports:
      - "8000:8000" # Djangoを実行する場合
    # environment:
    #   - DATABASE_URL=mysql+pymysql://user:password@db:3306/devdb
    # dbサービスが起動してからbackendを起動
    # TODO
    depends_on:
      db:
        condition: service_healthy
    # 依存インストール後にDjango起動（必要ならdebugpyへ置換可）
    command: bash -lc "pip install -r payment_system/requirements.txt && cd payment_system && python manage.py runserver 0.0.0.0:8000"
    tty: true
    stdin_open: true

  # Next.jsフロントエンドサービス
  frontend:
    build:
      context: ..
      dockerfile: .devcontainer/frontend/Dockerfile
    volumes:
      - ..:/workspaces/payment_system:cached
    ports:
      - "3001:3000"
      - "9229:9229" 
    # Node inspector を9229で待ち受け（VS Codeからアタッチ）
    # command: sh -lc "cd frontend/webapp && npm ci && node --inspect=0.0.0.0:9229 ./node_modules/.bin/next dev --hostname 0.0.0.0 -p 3000"
    command: sh -lc "cd frontend/webapp && npm ci && npx next dev --hostname 0.0.0.0 -p 3000"

  # PostgreSQL データベースサービス（本番用 docker-compose.yml と揃える）
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: payment_system_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      TZ: 'Asia/Tokyo'
    volumes:
      # 名前付きボリュームでデータを永続化
      - db-store:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 15s
      retries: 5

# データ永続化のための名前付きボリューム
volumes:
  db-store: